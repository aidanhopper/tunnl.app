entryPoints:
  tcp_tls:
    address: ":443"
providers:
  file:
    filename: "/etc/traefik/dynamic.yml"
    watch: true
certificatesResolvers:
  letsencrypt:
    acme:
      email: ADMIN_EMAIL
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 0
log:
  level: DEBUG
